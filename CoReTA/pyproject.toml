[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreta"
version = "0.3.1"
description = "Three-agent targeted assistance research prototype"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5"]

[project.optional-dependencies]
tokenizer = ["tokenizers>=0.20,<1"]
scoring = ["math-verify==0.9.0"]
data = ["pyarrow>=20,<27"]

[project.scripts]
coreta = "coreta.run:main"

[tool.setuptools.packages.find]
where = ["src"]
